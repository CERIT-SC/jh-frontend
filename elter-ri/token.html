<!doctype html>
<html lang="en" data-theme="elter">
  <head>
    <meta charset="UTF-8" />
    <link />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JupyterHub - Token Management</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.appConfig = {
        postUrl: "{{ url | safe }}",
        userName: "{{ user.name }}",
        xsrf: "{{ xsrf_token }}",
        api_tokens: [
          {% for token in api_tokens %}
          {
            api_id: "{{ token.api_id }}",
            note: "{{ token.note or '' }}",
            scopes: [{% for scope in token.scopes %}"{{ scope }}"{% if not loop.last %}, {% endif %}{% endfor %}],
            last_activity: {% if token.last_activity %}"{{ token.last_activity.isoformat() + 'Z' }}"{% else %}null{% endif %},
            created: {% if token.created %}"{{ token.created.isoformat() + 'Z' }}"{% else %}null{% endif %},
            expires_at: {% if token.expires_at %}"{{ token.expires_at.isoformat() + 'Z' }}"{% else %}null{% endif %}
          }{% if not loop.last %}, {% endif %}
          {% endfor %}
        ],
        oauth_clients: [
          {% for client in oauth_clients %}
          {
            token_id: "{{ client.token_id }}",
            description: "{{ (client.description or '') | safe }}",
            tokens: [{% for t in client.tokens %}{ scopes: [{% for scope in t.scopes %}"{{ scope }}"{% if not loop.last %}, {% endif %}{% endfor %}] }{% if not loop.last %}, {% endif %}{% endfor %}],
            last_activity: {% if client.last_activity %}"{{ client.last_activity.isoformat() + 'Z' }}"{% else %}null{% endif %},
            created: {% if client.created %}"{{ client.created.isoformat() + 'Z' }}"{% else %}null{% endif %}
          }{% if not loop.last %}, {% endif %}
          {% endfor %}
        ],
        auth_state: "{{ auth_state | safe }}",
        token_expires_in_options_html: `{{ token_expires_in_options_html | safe }}`,
        token_expires_in_max_seconds:
          "{{ token_expires_in_max_seconds | safe }}",
      };
    </script>
    <script type="module" src="/src/routes/token/token.tsx"></script>
  </body>
</html>
