<!doctype html>
<html lang="en" data-theme="elter">
  <head>
    <meta charset="UTF-8" />
    <link />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JupyterHub</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />
  </head>
  <body>
    <div id="root"></div>
    <div style="display: none">{{spawner_options_form | safe}}</div>
    <script>
      const appConfig = {
        postUrl: "{{ url | safe }}",
        userName: "{{ for_user.name }}",
        spawner: "{{ self.user_options }}",
        announcement: "{{ announcement | safe }}",
      };
    </script>
    <script type="module" src="/src/routes/spawn/form.tsx"></script>
  </body>
</html>
