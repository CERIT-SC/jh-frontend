<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .planet-base { fill: #373153; }
      .planet-shadow { fill: #2a2542; }
      .ring { fill: #7B6D98; opacity: 0.85; }
      .ring-line { fill: none; stroke: #ffffff; stroke-width: 2.5; opacity: 0.9; }
      .moon { fill: #221e33; }
      .error-text {
        font-family: 'Arial Black', 'Helvetica Black', Impact, sans-serif;
        font-size: 110px;
        font-weight: 900;
        fill: #ffffff;
        text-anchor: middle;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <g transform="rotate(-15 250 250)">
    <path d="M 20,250 A 230,75 0 0,1 480,250 L 400,250 A 150,50 0 0,0 100,250 Z" class="ring"/>
    
    <path d="M 80,250 A 170,56 0 0,1 420,250" class="ring-line"/>
    <path d="M 40,250 A 210,69 0 0,1 460,250" class="ring-line"/>
    
    <circle cx="453" cy="232" r="17" class="moon" />
  </g>

  <circle cx="250" cy="250" r="130" class="planet-base" />
  <path d="M 250 120 A 130 130 0 0 1 250 380 A 90 130 0 0 0 250 120 Z" class="planet-shadow" />

  <g transform="rotate(-15 250 250)">
    <path d="M 20,250 A 230,75 0 0,0 480,250 L 400,250 A 150,50 0 0,1 100,250 Z" class="ring"/>
    
    <path d="M 80,250 A 170,56 0 0,0 420,250" class="ring-line"/>
    <path d="M 40,250 A 210,69 0 0,0 460,250" class="ring-line"/>
    
    <circle cx="47" cy="268" r="14" class="moon" />
  </g>

  <text x="250" y="288" class="error-text">404</text>
</svg>