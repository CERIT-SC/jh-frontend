<svg xmlns="http://www.w3.org/2000/svg" width="1920" viewBox="0 0 1440 1635" height="2180" preserveAspectRatio="xMidYMid meet" version="1.1">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="gradient-primary-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CD9F4;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#8634FC;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#4CD9F4;stop-opacity:0.15"/>
    </linearGradient>
    
    <linearGradient id="gradient-secondary-light" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8634FC;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#4CD9F4;stop-opacity:0.08"/>
    </linearGradient>
    
    <linearGradient id="gradient-accent-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CD9F4;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#8634FC;stop-opacity:0.08"/>
    </linearGradient>
    
    <!-- Dark Mode Gradients -->
    <linearGradient id="gradient-primary-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CD9F4;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#8634FC;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#4CD9F4;stop-opacity:0.3"/>
    </linearGradient>
    
    <linearGradient id="gradient-secondary-dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8634FC;stop-opacity:0.28"/>
      <stop offset="100%" style="stop-color:#4CD9F4;stop-opacity:0.2"/>
    </linearGradient>
    
    <linearGradient id="gradient-accent-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CD9F4;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#8634FC;stop-opacity:0.18"/>
    </linearGradient>
    
    <!-- Filter for glow effect -->
    <filter id="glow-light" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glow-dark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Light Mode (default) -->
  <g id="light-mode">
    <!-- Background -->
    <rect width="1440" height="1635" fill="#f8fafc"/>
    
    <!-- Top-left gradient blob -->
    <ellipse cx="200" cy="150" rx="400" ry="350" fill="url(#gradient-primary-light)" filter="url(#glow-light)"/>
    
    <!-- Bottom-right gradient blob -->
    <ellipse cx="1240" cy="1400" rx="450" ry="400" fill="url(#gradient-secondary-light)" filter="url(#glow-light)"/>
    
    <!-- Center accent gradient -->
    <ellipse cx="720" cy="820" rx="380" ry="320" fill="url(#gradient-accent-light)" filter="url(#glow-light)"/>
    
    <!-- Wave pattern 1 - Top -->
    <path d="M -100 400 Q 360 300 720 380 T 1540 420 L 1540 550 Q 720 480 0 520 Z" 
          fill="url(#gradient-primary-light)" opacity="0.5"/>
    
    <!-- Wave pattern 2 - Middle -->
    <path d="M -100 750 Q 400 650 720 720 T 1540 780 L 1540 900 Q 720 850 0 880 Z" 
          fill="url(#gradient-secondary-light)" opacity="0.4"/>
    
    <!-- Wave pattern 3 - Bottom -->
    <path d="M -100 1100 Q 380 1000 720 1080 T 1540 1150 L 1540 1280 Q 720 1220 0 1250 Z" 
          fill="url(#gradient-accent-light)" opacity="0.5"/>
    
    <!-- Subtle grid pattern overlay -->
    <pattern id="grid-light" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#4CD9F4" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <rect width="1440" height="1635" fill="url(#grid-light)"/>
  </g>
  
  <!-- Dark Mode (hidden by default, shown via CSS) -->
  <g id="dark-mode" style="display:none;">
    <!-- Background -->
    <rect width="1440" height="1635" fill="#0f172a"/>
    
    <!-- Top-left gradient blob -->
    <ellipse cx="200" cy="150" rx="400" ry="350" fill="url(#gradient-primary-dark)" filter="url(#glow-dark)"/>
    
    <!-- Bottom-right gradient blob -->
    <ellipse cx="1240" cy="1400" rx="450" ry="400" fill="url(#gradient-secondary-dark)" filter="url(#glow-dark)"/>
    
    <!-- Center accent gradient -->
    <ellipse cx="720" cy="820" rx="380" ry="320" fill="url(#gradient-accent-dark)" filter="url(#glow-dark)"/>
    
    <!-- Wave pattern 1 - Top -->
    <path d="M -100 400 Q 360 300 720 380 T 1540 420 L 1540 550 Q 720 480 0 520 Z" 
          fill="url(#gradient-primary-dark)" opacity="0.6"/>
    
    <!-- Wave pattern 2 - Middle -->
    <path d="M -100 750 Q 400 650 720 720 T 1540 780 L 1540 900 Q 720 850 0 880 Z" 
          fill="url(#gradient-secondary-dark)" opacity="0.5"/>
    
    <!-- Wave pattern 3 - Bottom -->
    <path d="M -100 1100 Q 380 1000 720 1080 T 1540 1150 L 1540 1280 Q 720 1220 0 1250 Z" 
          fill="url(#gradient-accent-dark)" opacity="0.6"/>
    
    <!-- Subtle grid pattern overlay -->
    <pattern id="grid-dark" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#4CD9F4" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <rect width="1440" height="1635" fill="url(#grid-dark)"/>
  </g>
  
  <!-- CSS for theme switching -->
  <style type="text/css">
    @media (prefers-color-scheme: dark) {
      #light-mode { display: none; }
      #dark-mode { display: block; }
    }
  </style>
</svg>
