<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JupyterHub</title>
    <!--
      Security headers via meta tags (defense-in-depth).
      NOTE: frame-ancestors and X-Frame-Options cannot be set via <meta>,
      they MUST be configured as HTTP response headers on the server.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta
      http-equiv="Referrer-Policy"
      content="strict-origin-when-cross-origin"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      const appConfig = {
        progressUrl: "{{ progress_url }}",
        userName: "{{ user.name }}",
      };
    </script>
    <script
      type="module"
      src="/src/routes/spawn-pending/spawn_pending.jsx"
    ></script>
  </body>
</html>
